<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2050" role="img" aria-label="Proposta com EJB"><title>Proposta com EJB</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#52606d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181c}.heading{fill:#001e62;font-size:25px;font-weight:700;letter-spacing:1px}.title{fill:#001e62;font-size:17px;font-weight:600}.section{fill:#0033cc;font-size:15px;font-weight:700;letter-spacing:1px}.small{font-size:14px;fill:#55606d}.edge-label{font-size:12px;fill:#354251;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.selected>rect{stroke:#0033cc;stroke-width:3}.selected>polyline:not(.hit){stroke:#0033cc;stroke-width:3}.change-new>rect{fill:#0033cc}.change-new .title,.change-new .small{fill:#fff}.change-new>path,.change-new>circle{stroke:#fff}.change-adapt>rect{fill:#e2ebff}.change-legacy>rect{fill:#e1e3e7;stroke:#737a85}.change-legacy .title{fill:#252a33}.change-existing>rect{fill:#fff;stroke:#737a85}.change-new.selected>rect{stroke:#16181c;stroke-width:4;stroke-dasharray:6 3}</style><rect width="100%" height="100%" fill="white"/><g data-node="stage1" class="node"><rect x="40" y="125" width="1620" height="320" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="153" class="section">01   ELEGIBILIDADE E SIMULAÇÃO</text><text x="58" y="175" class="small">Fluxos de acesso à PDEC — comuns aos três cenários</text></g><g data-node="internalboundary" class="node"><rect x="40" y="475" width="340" height="240" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="503" class="section">CANAL INTERNO</text><text x="58" y="525" class="small">Fora da estrutura de crédito</text></g><g data-node="externalboundary" class="node"><rect x="40" y="745" width="340" height="880" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="773" class="section">CANAL EXTERNO</text><text x="58" y="795" class="sm