 resultado posterior</text></g><g data-edge="persist"><polyline class="hit" points="790,920 790,1066 700,1066 700,1090" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="790,920 790,1066 700,1066 700,1090" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="790,920 790,1066 700,1066 700,1090" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="745" y="1056" text-anchor="middle" transform="rotate(0 745 1056)" class="edge-label">Grava proposta e status</text></g><g data-edge="dbpta"><polyline class="hit" points="880,1145 1030,1145" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="880,1145 1030,1145" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="880,1145 1030,1145" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="955" y="1135" text-anchor="middle" transform="rotate(0 955 1135)" class="edge-label">Proposta / status</text></g><g data-edge="manualrequest"><polyline class="hit" points="1290,1145 1390,1145" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1290,1145 1390,1145" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1290,1145 1390,1145" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1340" y="1135" text-anchor="middle" transform="rotate(0 1340 1135)" class="edge-label">Abre análise</text></g><g data-edge="manualresult"><polyline class="hit" points="1510,1200 1510,1224 1116.6666666666667,1224 1116.6666666666667,1200" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1510,1200 1510,1224 1116.6666666666667,1224 1116.6666666666667,1200" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1510,1200 1510,1224 1116.6666666666667,1224 1116.6666666666667,1200" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1313.3333333333335" y="1214" text-anchor="middle" transform="rotate(0 1313.3333333333335 1214)" class="edge-label">Decisão manual</text></g><g data-edge="savemanual"><polyline class="hit" points="1203.3333333333333,1200 1203.3333333333333,1250 640,1250 640,1200" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1203.3333333333333,1200 1203.3333333333333,1250 640,1250 640,1200" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1203.3333333333333,1200 1203.3333333333333,1250 640,1250 640,1200" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="921.6666666666666" y="1240" text-anchor="middle" transform="rotate(0 921.6666666666666 1240)" class="edge-label">Persiste decisão</text></g><g data-edge="readstatus"><polyline class="hit" points="520,1145 496,1145 496,886.6666666666666 520,886.6666666666666" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="520,1145 496,1145 496,886.6666666666666 520,886.6666666666666" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="520,1145 496,1145 496,886.6666666666666 520,886.6666666666666" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="508" y="1067.5" text-anchor="middle" transform="rotate(-90 508 1067.5)" class="edge-label">Lê status / resultado</text></g><g data-edge="enforcestatus"><polyline class="hit" points="760,1200 760,1366 750,1366 750,1390" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="760,1200 760,1366 750,1366 750,1390" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="760,1200 760,1366 750,1366 750,1390" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="772" y="1283" text-anchor="middle" transform="rotate(-90 772 1283)" class="edge-label">Origem externa: bloqueio</text></g><g data-edge="internalentry"><polyline class="hit" points="350,630 700,630 700,820" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="350,630 700,630 700,820" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="350,630 700,630 700,820" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="525" y="620" text-anchor="middle" transform="rotate(0 525 620)" class="edge-label">Solicita captura</text></g><g data-node="heading" class="node"><rect x="40" y="25" width="1600" height="80" fill="transparent"/><text x="40" y="53" class="heading">ANÁLISE DE CRÉDITO</text><text x="40" y="80" class="small">Proposta com EJB  /  Alternativa de transição — não é o alvo recomendado  /  22.10.2026</text></g><g data-node="channels" class="node change-existing"><rect x="70" y="200" width="270" height="94" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="229" class="title">Canais / consumidores</text><text x="86" y="252" class="small">Integração direta com a PDEC</text></g><g data-node="legacy" class="node change-legacy"><rect x="70" y="330" width="270" height="94" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="359" class="title">Consumidores legados</text><text x="86" y="382" class="small">Times que utilizam o GCRE</text></g><g data-node="gcre" class="node change-legacy"><rect x="520" y="330" width="270" height="94" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="359" class="title">GCRE</text><text x="536" y="382" class="small">On-premises | Integração legada</text></g><g data-node="pdec1" class="node change-existing"><rect x="1170" y="200" width="430" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1186" y="229" class="title">PDEC</text><text x="1186" y="252" class="small">GCP / Kubernetes (K8s)</text><text x="1186" y="272" class="small">Elegibilidade e simulação</text></g><g data-node="origin" class="node change-existing"><rect x="70" y="820" width="280" height="100" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="849" class="title">Canal externo</text><text x="86" y="872" class="small">Solicita a captura</text><text x="86" y="892" class="small">Recebe o retorno posteriormente</text></g><g data-node="proposal" class="node change-adapt"><rect x="520" y="820" width="360" height="100" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="849" class="title">EJB de crédito</text><text x="536" y="872" class="small">Captura e persistência da proposta</text><text x="536" y="892" class="small">On-premises | Java / EJB / JBoss</text></g><g data-node="pdec2" class="node change-existing"><rect x="1170" y="820" width="430" height="100" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1186" y="849" class="title">PDEC</text><text x="1186" y="872" class="small">GCP / Kubernetes (K8s)</text><text x="1186" y="892" class="small">PDD, score e rating</text></g><g data-node="db" class="node change-adapt"><rect x="520" y="1090" width="360" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><path d="M520,1100 Q700,1120 880,1100" fill="none" stroke="#0033cc"/><text x="536" y="1132" class="title">Sybase</text><text x="536" y="1157" class="small">Proposta, origem interna / externa e status</text><text x="536" y="1177" class="small">Persistência on-premises</text></g><g data-node="pta" class="node change-adapt"><rect x="1030" y="1090" width="260" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="1119" class="title">PTA</text><text x="1046" y="1142" class="small">Proposta derivada</text><text x="1046" y="1162" class="small">Consulta e registra decisão</text></g><g data-node="human" class="node change-existing"><rect x="1390" y="1090" width="240" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><circle cx="1410" cy="1113" r="6" fill="none" stroke="#374151"/><path d="M1410,1119v16m-9,-10h18m-9,10l-8,10m8,-10l8,10" fill="none" stroke="#374151"/><text x="1430" y="1119" class="title">Mesa de crédito</text><text x="1430" y="1142" class="small">Analista interno</text><text x="1430" y="1162" class="small">PowerApps: gestão das filas</text></g><g data-node="channelcontract" class="node change-new"><rect x="70" y="1090" width="280" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="1119" class="title">Novo contrato assíncrono</text><text x="86" y="1142" class="small">Status em análise manual</text><text x="86" y="1162" class="small">Resultado após conclusão</text><text x="86" y="1182" class="small">Mecanismo de retorno a definir</text></g><g data-node="statusrule" class="node change-new"><rect x="520" y="1390" width="460" height="140" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="1419" class="title">Controle de encaminhamento</text><text x="536" y="1442" class="small">Proposta de canal externo</text><text x="536" y="1462" class="small">NÃO ENCAMINHAR AO PAGAMENTO INTERNO</text><text x="536" y="1482" class="small">Bloquear também a formalização</text><text x="536" y="1502" class="small">Código do status a definir</text></g><g data-node="payment" class="node change-existing"><rect x="1170" y="1390" width="430" height="140" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1186" y="1419" class="title">Formalização / pagamento</text><text x="1186" y="1442" class="small">Origem externa: não encaminhar.</text><text x="1186" y="1462" class="small">Canal interno mantém seu fluxo</text><text x="1186" y="1482" class="small">existente via MQ.</text></g><g data-node="manualnote" class="node"><rect x="520" y="1560" width="1100" height="35" fill="transparent"/><text x="520" y="1578" class="small">Análise manual realizada dentro do crédito. O canal externo não aguarda uma chamada aberta durante a análise humana.</text></g><g data-node="legacyrisk" class="node change-existing"><rect x="40" y="1650" width="1620" height="215" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="56" y="1679" class="title">LIMITAÇÕES DA ALTERNATIVA COM EJB</text><text x="56" y="1702" class="small">Mantém dependência de Java/EJB/JBoss, Sybase e acesso direto do PTA à base.</text><text x="56" y="1722" class="small">Legado de manutenção extremamente complexa: ajustes têm alto esforço e risco de regressão.</text><text x="56" y="1742" class="small">No AS IS, a fila MQ informa alterações de status; propostas aprovadas seguem para formalização e pagamento.</text><text x="56" y="1762" class="small">Para propostas externas, é necessário impedir esse encaminhamento sem afetar o fluxo interno existente.</text><text x="56" y="1782" class="small">Exige mapear e ajustar regras de status, publicação e consumo MQ; os pontos de bloqueio ainda precisam ser definidos.</text><text x="56" y="1802" class="small">A validação deve cobrir aprovação automática/manual e reprocessamento de mensagens, além dos contratos legados.</text><text x="56" y="1822" class="small">Uso como transição. O alvo permanece a separação da captura e da análise, com comunicação por eventos.</text></g><g data-node="legendnew" class="node change-new"><rect x="40" y="1890" width="500" height="95" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="56" y="1919" class="title">AZUL · A DESENVOLVER</text><text x="56" y="1942" class="small">Novo contrato / nova regra funcional.</text><text x="56" y="1962" class="small">Não implica um novo serviço independente.</text></g><g data-node="legendadapt" class="node change-adapt"><rect x="600" y="1890" width="500" height="95" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="616" y="1919" class="title">AZUL CLARO · A ADAPTAR</text><text x="616" y="1942" class="small">Componentes existentes que precisam</text><text x="616" y="1962" class="small">de mudanças para suportar esta proposta.</text></g><g data-node="legendlegacy" class="node change-legacy"><rect x="1160" y="1890" width="500" height="95" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1176" y="1919" class="title">CINZA · LEGADO MANTIDO</text><text x="1176" y="1942" class="small">Branco: componente existente / referência.</text><text x="1176" y="1962" class="small">Classificação de escopo proposta para revisão.</text></g><g data-node="legend" class="node"><rect x="40" y="2010" width="1620" height="30" fill="transparent"/><text x="40" y="2028" class="small">Pontilhado: interação assíncrona / retorno posterior. Contínuo: chamada / persistência. Origem externa: sem formalização / pagamento.</text></g><g data-node="internalchannel" class="node change-existing"><rect x="70" y="580" width="280" height="100" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="609" class="title">Canal interno</text><text x="86" y="632" class="small">Solicita captura da proposta</text><text x="86" y="652" class="small">Fluxo interno existente</text></g></svg>