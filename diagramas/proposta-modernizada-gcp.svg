<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1850" role="img" aria-label="Supermodernizado — análise por eventos"><title>Supermodernizado — análise por eventos</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#52606d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181c}.heading{fill:#001e62;font-size:25px;font-weight:700;letter-spacing:1px}.title{fill:#001e62;font-size:17px;font-weight:600}.section{fill:#0033cc;font-size:15px;font-weight:700;letter-spacing:1px}.small{font-size:14px;fill:#55606d}.edge-label{font-size:12px;fill:#354251;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.selected>rect{stroke:#0033cc;stroke-width:3}.selected>polyline:not(.hit){stroke:#0033cc;stroke-width:3}.change-new>rect{fill:#0033cc}.change-new .title,.change-new .small{fill:#fff}.change-new>path,.change-new>circle{stroke:#fff}.change-adapt>rect{fill:#e2ebff}.change-legacy>rect{fill:#e1e3e7;stroke:#737a85}.change-legacy .title{fill:#252a33}.change-existing>rect{fill:#fff;stroke:#737a85}.change-new.selected>rect{stroke:#16181c;stroke-width:4;stroke-dasharray:6 3}</style><rect width="100%" height="100%" fill="white"/><g data-node="stage1" class="node"><rect x="40" y="125" width="1620" height="320" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="153" class="section">01   ELEGIBILIDADE E SIMULAÇÃO</text><text x="58" y="175" class="small">Canais acessam diretamente a PDEC no Kubernetes do GCP.</text></g><g data-node="ownership" class="node"><rect x="40" y="475" width="1620" height="560" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="503" class="section">02   CAPTURA SEPARADA → PROPOSTA PERSISTIDA → ANÁLISE</text><text x="58" y="525" class="small">O canal solicita a captura; o componente persiste a proposta e só então publica o evento no Kafka.</text></g><g data-node="processing" class="node"><rect x="40" y="1065" width="1620" height="470" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="1093" class="section">03   ANÁLISE AUTOMÁTICA · CHAMADA SÍNCRONA</text><text x="58" y="1115" class="small">O serviço de análise chama diretamente a PDEC e aguarda o resultado. Não há Kafka nesta chamada.</text></g><g data-node="humanstage" class="node"><rect x="40" y="1565" width="1620" height="215" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="1593" class="section">04   ANÁLISE MANUAL INTERNA</text><text x="58" y="1615" class="small">Nova mesa interna, com interface e serviço próprios integrados aos eventos.</text></g><g data-edge="direct"><polyline class="hit" points="340,247 364,247 364,255 1170,255" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="340,247 364,247 364,255 1170,255" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="340,247 364,247 364,255 1170,255" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="767" y="245" text-anchor="middle" transform="rotate(0 767 245)" class="edge-label">Elegibilidade / simulação</text></g><g data-edge="saveproposal"><polyline class="hit" points="230,810 230,900" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="230,810 230,900" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="230,810 230,900" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="242" y="855" text-anchor="middle" transform="rotate(-90 242 855)" class="edge-label">Persiste</text></g><g data-edge="requestcredit"><polyline class="hit" points="390,757.5 550,757.5" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="390,757.5 550,757.5" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="390,757.5 550,757.5" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)