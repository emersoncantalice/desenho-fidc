me decisão</text></g><g data-edge="humanrequest"><polyline class="hit" points="1330,915 1354,915 1354,905 1390,905" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1330,915 1354,915 1354,905 1390,905" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1330,915 1354,915 1354,905 1390,905" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1366" y="910" text-anchor="middle" transform="rotate(-90 1366 910)" class="edge-label">Análise</text></g><g data-edge="humanresult"><polyline class="hit" points="1510,960 1510,1004 1180,1004 1180,980" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1510,960 1510,1004 1180,1004 1180,980" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1510,960 1510,1004 1180,1004 1180,980" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1345" y="994" text-anchor="middle" transform="rotate(0 1345 994)" class="edge-label">Registra decisão</text></g><g data-edge="statusrule"><polyline class="hit" points="700,980 700,1170" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="700,980 700,1170" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="700,980 700,1170" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="712" y="1075" text-anchor="middle" transform="rotate(-90 712 1075)" class="edge-label">Conclui análise FIDC</text></g><g data-edge="notifychannel"><polyline class="hit" points="520,1235 350,1235" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="520,1235 350,1235" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="520,1235 350,1235" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="435" y="1225" text-anchor="middle" transform="rotate(0 435 1225)" class="edge-label">API síncrona</text></g><g data-edge="callbackresponse"><polyline class="hit" points="210,1300 210,1324 700,1324 700,1300" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="210,1300 210,1324 700,1324 700,1300" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="210,1300 210,1324 700,1324 700,1300" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="455" y="1314" text-anchor="middle" transform="rotate(0 455 1314)" class="edge-label">Confirma recebimento</text></g><g data-node="heading" class="node"><rect x="40" y="25" width="1620" height="80" fill="transparent"/><text x="40" y="53" class="heading">ANÁLISE DE CRÉDITO</text><text x="40" y="80" class="small">Nova mesa simplificada na PDEC-JULG / Propostas FIDC no novo Building Block de Propostas</text></g><g data-node="channel" class="node"><rect x="70" y="250" width="280" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="279" class="title">Canal externo</text><text x="86" y="302" class="small">Envia proposta FIDC por API</text><text x="86" y="322" class="small">Recebe protocolo de aceite</text></g><g data-node="credit" class="node change-new"><rect x="520" y="250" width="360" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="279" class="title">Esteira de análise</text><text x="536" y="302" class="small">GCP | Orquestra gravação e análise</text><text x="536" y="322" class="small">API síncrona: aceite com protocolo</text></g><g data-node="pdec" class="node"><rect x="1170" y="250" width="430" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1186" y="279" class="title">PDEC</text><text x="1186" y="302" class="small">GCP / Kubernetes (K8s)</text><text x="1186" y="322" class="small">Análise automática</text></g><g data-node="proposalblock" class="node"><rect x="520" y="530" width="360" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="559" class="title">Building Block de Propostas</text><text x="536" y="582" class="small">Salva a proposta com marcação FIDC</text><text x="536" y="602" class="small">Novo Building Block de Propostas</text><text x="536" y="622" class="small">Persistência sob sua responsabilidade</text></g><g data-node="mysql" class="node change-new"><rect x="520" y="850" width="360" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><path d="M520,860 Q700,880 880,860" fill="none" stroke="#0033cc"/><text x="536" y="892" class="title">MySQL cloud</text><text x="536" y="917" class="small">Estado e resultados da análise</text><text x="536" y="937" class="small">Referência à proposta no Building Block</text><text x="536" y="957" class="small">Protocolo e controle do callback</text></g><g data-node="kafka" class="node"><rect x="1030" y="530" width="300" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="559" class="title">Confluent Kafka</text><text x="1046" y="582" class="small">Solicitações e decisões de análise</text><text x="1046" y="602" class="small">Integração proposta por eventos</text></g><g data-node="newdesk" class="node change-new"><rect x="1030" y="850" width="300" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="879" class="title">PDEC-JULG · Mesa FIDC</text><text x="1046" y="902" class="small">Mesa simplificada</text><text x="1046" y="922" class="small">Fila única de propostas FIDC</text><text x="1046" y="942" class="small">Somente migradas para o novo BB</text></g><g data-node="human" class="node"><rect x="1390" y="850" width="240" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><circle cx="1410" cy="873" r="6" fill="none" stroke="#374151"/><path d="M1410,879v16m-9,-10h18m-9,10l-8,10m8,-10l8,10" fill="none" stroke="#374151"/><text x="1430" y="879" class="title">Analista interno</text><text x="1430" y="902" class="small">Analisa propostas FIDC</text><text x="1430" y="922" class="small">Registra a decisão</text></g><g data-node="status" class="node change-new"><rect x="520" y="1170" width="360" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="1199" class="title">FIM DA ANÁLISE · FIDC</text><text x="536" y="1222" class="small">Proposta marcada como FIDC</text><text x="536" y="1242" class="small">Encerra na análise de crédito</text><text x="536" y="1262" class="small">Sem formalização ou pagamento</text></g><g data-node="deskaccess" class="node"><rect x="1030" y="1170" width="600" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="1199" class="title">ESCOPO DA MESA SIMPLIFICADA</text><text x="1046" y="1222" class="small">Exibe apenas propostas FIDC já migradas para o novo Building Block.</text><text x="1046" y="1242" class="small">Fila única, sem gestão de filas.</text><text x="1046" y="1262" class="small">Propostas legadas não migradas ficam fora desta mesa.</text></g><g data-node="contract" class="node change-new"><rect x="70" y="530" width="280" height="145" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="559" class="title">OPÇÃO API + CALLBACK</text><text x="86" y="582" class="small">Entrada síncrona: protocolo</text><text x="86" y="602" class="small">Após conclusão: API do canal</text><text x="86" y="622" class="small">Chamada síncrona com resposta</text><text x="86" y="642" class="small">Correlação por protocolo e proposta</text></g><g data-node="channelapi" class="node"><rect x="70" y="1170" width="280" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="1199" class="title">API externa do canal</text><text x="86" y="1222" class="small">Recebe resultado final</text><text x="86" y="1242" class="small">Protocolo + ID da proposta</text><text x="86" y="1262" class="small">Responde à chamada síncrona</text></g><g data-node="scope" class="node"><rect x="40" y="1480" width="1620" height="165" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="56" y="1509" class="title">ESCOPO DA TERCEIRA VISÃO</text><text x="56" y="1532" class="small">A proposta é salva no novo Building Block de Propostas com a marcação FIDC. MySQL mantém os dados da análise e da integração.</text><text x="56" y="1552" class="small">A mesa simplificada fica dentro da PDEC-JULG e exibe apenas propostas FIDC já migradas para o novo Building Block.</text><text x="56" y="1572" class="small">Há uma única fila de propostas FIDC, sem gestão de filas. Nenhum acesso ao Sybase, EJB ou PTA legado.</text><text x="56" y="1592" class="small">A proposta encerra seu fluxo na análise de crédito, inclusive quando aprovada: sem encaminhamento à formalização ou ao pagamento.</text><text x="56" y="1612" class="small">Opção de integração externa: entrada síncrona com protocolo; após a análise, chamada síncrona à API do canal.</text></g><g data-node="legend" class="node"><rect x="40" y="1680" width="1620" height="40" fill="transparent"/><text x="40" y="1698" class="small">Azul: a desenvolver / implantar. Branco: referência. Pontilhado: eventos / análise humana. Contínuo: API síncrona / resposta / persistência.</text></g></svg>