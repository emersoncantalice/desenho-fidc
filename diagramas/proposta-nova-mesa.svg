1.5"  marker-end="url(#arrow)"/><text x="1042.5" y="394" text-anchor="middle" transform="rotate(0 1042.5 394)" class="edge-label">Resultado / derivação</text></g><g data-edge="derive"><polyline class="hit" points="790,380 790,506 1180,506 1180,530" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="790,380 790,506 1180,506 1180,530" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="790,380 790,506 1180,506 1180,530" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="985" y="496" text-anchor="middle" transform="rotate(0 985 496)" class="edge-label">Deriva análise manual</text></g><g data-edge="manualrequest"><polyline class="hit" points="1130,640 1130,826 1180,826 1180,850" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1130,640 1130,826 1180,826 1180,850" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1130,640 1130,826 1180,826 1180,850" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1142" y="733" text-anchor="middle" transform="rotate(-90 1142 733)" class="edge-label">Solicitações FIDC</text></g><g data-edge="manualresult"><polyline class="hit" points="1030,915 1006,915 1006,585 1030,585" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1030,915 1006,915 1006,585 1030,585" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1030,915 1006,915 1006,585 1030,585" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1018" y="750" text-anchor="middle" transform="rotate(-90 1018 750)" class="edge-label">Decisão manual</text></g><g data-edge="consolidate"><polyline class="hit" points="1230,640 1230,664 904,664 904,336.66666666666663 880,336.66666666666663" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1230,640 1230,664 904,664 904,336.66666666666663 880,336.66666666666663" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1230,640 1230,664 904,664 904,336.66666666666663 880,336.66666666666663" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1067" y="654" text-anchor="middle" transform="rotate(0 1067 654)" class="edge-label">Consome decisão</text></g><g data-edge="humanrequest"><polyline class="hit" points="1330,915 1354,915 1354,905 1390,905" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1330,915 1354,915 1354,905 1390,905" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1330,915 1354,915 1354,905 1390,905" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1366" y="910" text-anchor="middle" transform="rotate(-90 1366 910)" class="edge-label">Análise</text></g><g data-edge="humanresult"><polyline class="hit" points="1510,960 1510,1004 1180,1004 1180,980" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1510,960 1510,1004 1180,1004 1180,980" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1510,960 1510,1004 1180,1004 1180,980" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1345" y="994" text-anchor="middle" transform="rotate(0 1345 994)" class="edge-label">Registra decisão</text></g><g data-node="heading" class="node"><rect x="40" y="25" width="1620" height="80" fill="transparent"/><text x="40" y="53" class="heading">ANÁLISE DE CRÉDITO</text><text x="40" y="80" class="small">Nova mesa simplificada na PCRE-JULG / Solicitações de análise de crédito FIDC, sem proposta</text></g><g data-node="channel" class="node"><rect x="70" y="250" width="280" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="279" class="title">Parceiro</text><text x="86" y="302" class="small">Solicita análise de crédito FIDC</text><text x="86" y="322" class="small">Recebe protocolo de aceite</text><text x="86" y="342" class="small">Certificado de cliente (mTLS)</text></g><g data-node="credit" class="node change-new"><rect x="520" y="250" width="360" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="536" y="279" class="title">Esteira de análise</text><text x="536" y="302" class="small">GCP | Recebe a solicitação de análise</text><text x="536" y="322" class="small">Persiste a análise e retorna ao parceiro</text><text x="536" y="342" class="small">API síncrona: aceite com protocolo</text></g><g data-node="pdec" class="node"><rect x="1170" y="250" width="430" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1186" y="279" class="title">PDEC</text><text x="1186" y="302" class="small">GCP / Kubernetes (K8s)</text><text x="1186" y="322" class="small">Análise automática</text></g><g data-node="mysql" class="node change-new"><rect x="520" y="530" width="360" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><path d="M520,540 Q700,560 880,540" fill="none" stroke="#0033cc"/><text x="536" y="572" class="title">MySQL cloud</text><text x="536" y="597" class="small">Base da esteira de análise</text><text x="536" y="617" class="small">Solicitação, estado e resultado da análise</text><text x="536" y="637" class="small">Protocolo e controle do retorno ao parceiro</text></g><g data-node="kafka" class="node"><rect x="1030" y="530" width="300" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="559" class="title">Confluent Kafka</text><text x="1046" y="582" class="small">Solicitações e decisões de análise</text><text x="1046" y="602" class="small">Integração proposta por eventos</text></g><g data-node="newdesk" class="node change-new"><rect x="1030" y="850" width="300" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="879" class="title">PCRE-JULG · Mesa FIDC</text><text x="1046" y="902" class="small">Mesa simplificada</text><text x="1046" y="922" class="small">Fila única de solicitações FIDC</text><text x="1046" y="942" class="small">Derivadas pela esteira de análise</text></g><g data-node="human" class="node"><rect x="1390" y="850" width="240" height="110" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><circle cx="1410" cy="873" r="6" fill="none" stroke="#374151"/><path d="M1410,879v16m-9,-10h18m-9,10l-8,10m8,-10l8,10" fill="none" stroke="#374151"/><text x="1430" y="879" class="title">Analista interno</text><text x="1430" y="902" class="small">Analisa solicitações FIDC</text><text x="1430" y="922" class="small">Registra a decisão</text></g><g data-node="deskaccess" class="node"><rect x="1030" y="1090" width="600" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1046" y="1119" class="title">ESCOPO DA MESA SIMPLIFICADA</text><text x="1046" y="1142" class="small">Exibe apenas solicitações de análise de crédito FIDC derivadas pela esteira.</text><text x="1046" y="1162" class="small">Fila única, sem gestão de filas.</text><text x="1046" y="1182" class="small">Sem propostas: o Building Block de Propostas não participa.</text></g><g data-node="channelapi" class="node"><rect x="70" y="530" width="280" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="559" class="title">API do parceiro</text><text x="86" y="582" class="small">Recebe resultado final</text><text x="86" y="602" class="small">Protocolo + ID da solicitação</text><text x="86" y="622" class="small">Responde à chamada síncrona</text><text x="86" y="642" class="small">Exige mTLS</text></g><g data-node="contract" class="node change-new"><rect x="70" y="850" width="280" height="165" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="879" class="title">OPÇÃO API + CALLBACK</text><text x="86" y="902" class="small">Entrada síncrona: protocolo</text><text x="86" y="922" class="small">Após conclusão: API do parceiro</text><text x="86" y="942" class="small">Chamada síncrona com resposta</text><text x="86" y="962" class="small">Correlação pelo protocolo</text><text x="86" y="982" class="small">mTLS nas duas chamadas</text></g><g data-node="scope" class="node"><rect x="40" y="1300" width="1620" height="165" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="56" y="1329" class="title">ESCOPO DA TERCEIRA VISÃO</text><text x="56" y="1352" class="small">O objeto é a solicitação de análise de crédito FIDC, não a proposta. O Building Block de Propostas não participa deste fluxo.</text><text x="56" y="1372" class="small">A própria esteira de análise persiste a solicitação e a análise no MySQL e, ao concluir, retorna o resultado ao parceiro.</text><text x="56" y="1392" class="small">A mesa simplificada fica dentro da PCRE-JULG e exibe apenas solicitações FIDC derivadas, em fila única, sem gestão de filas.</text><text x="56" y="1412" class="small">Nenhum acesso ao Sybase, EJB ou PTA legado. O fluxo encerra na análise de crédito: não gera proposta, formalização ou pagamento.</text><text x="56" y="1432" class="small">Opção de integração externa: entrada síncrona com protocolo; após a análise, chamada síncrona à API do parceiro. As duas chamadas exigem mTLS.</text></g><g data-node="legend" class="node"><rect x="40" y="1500" width="1620" height="40" fill="transparent"/><text x="40" y="1518" class="small">Azul: a desenvolver / implantar. Branco: referência. Pontilhado: eventos / análise humana. Contínuo: API síncrona / resposta / persistência.</text></g></svg>