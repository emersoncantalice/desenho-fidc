<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1560" role="img" aria-label="Nova mesa — solicitações FIDC"><title>Nova mesa — solicitações FIDC</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#52606d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181c}.heading{fill:#001e62;font-size:25px;font-weight:700;letter-spacing:1px}.title{fill:#001e62;font-size:17px;font-weight:600}.section{fill:#0033cc;font-size:15px;font-weight:700;letter-spacing:1px}.small{font-size:14px;fill:#55606d}.edge-label{font-size:12px;fill:#354251;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.selected>rect{stroke:#0033cc;stroke-width:3}.selected>polyline:not(.hit){stroke:#0033cc;stroke-width:3}.change-new>rect{fill:#0033cc}.change-new .title,.change-new .small{fill:#fff}.change-new>path,.change-new>circle{stroke:#fff}.change-adapt>rect{fill:#e2ebff}.change-legacy>rect{fill:#e1e3e7;stroke:#737a85}.change-legacy .title{fill:#252a33}.change-existing>rect{fill:#fff;stroke:#737a85}.change-new.selected>rect{stroke:#16181c;stroke-width:4;stroke-dasharray:6 3}</style><rect width="100%" height="100%" fill="white"/><g data-node="outside" class="node"><rect x="40" y="130" width="340" height="1130" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="158" class="section">PARCEIRO</text><text x="58" y="180" class="small">Opção: entrada por API e callback, com mTLS</text></g><g data-node="inside" class="node"><rect x="440" y="130" width="1220" height="1130" fill="#f4f6fa" stroke="#cbd3e3"/><text x="458" y="158" class="section">ANÁLISE DE CRÉDITO · NOVA MESA FIDC</text><text x="458" y="180" class="small">Esteira no GCP com persistência própria, integrada à PDEC e à mesa simplificada na PCRE-JULG.</text></g><g data-edge="entry"><polyline class="hit" points="350,286.6666666666667 374,286.6666666666667 374,276 520,276" stroke="transparent