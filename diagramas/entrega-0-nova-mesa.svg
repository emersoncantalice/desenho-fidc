<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1540" role="img" aria-label="Entrega 1 — Simulação e análise automática"><title>Entrega 1 — Simulação e análise automática</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#52606d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16181c}.heading{fill:#001e62;font-size:25px;font-weight:700;letter-spacing:1px}.title{fill:#001e62;font-size:17px;font-weight:600}.section{fill:#0033cc;font-size:15px;font-weight:700;letter-spacing:1px}.small{font-size:14px;fill:#55606d}.edge-label{font-size:12px;fill:#354251;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.selected>rect{stroke:#0033cc;stroke-width:3}.selected>polyline:not(.hit){stroke:#0033cc;stroke-width:3}.change-new>rect{fill:#0033cc}.change-new .title,.change-new .small{fill:#fff}.change-new>path,.change-new>circle{stroke:#fff}.change-adapt>rect{fill:#e2ebff}.change-legacy>rect{fill:#e1e3e7;stroke:#737a85}.change-legacy .title{fill:#252a33}.change-existing>rect{fill:#fff;stroke:#737a85}.change-new.selected>rect{stroke:#16181c;stroke-width:4;stroke-dasharray:6 3}</style><rect width="100%" height="100%" fill="white"/><g data-node="sync" class="node"><rect x="40" y="130" width="1720" height="290" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="158" class="section">01 | SIMULAÇÃO SÍNCRONA</text><text x="58" y="180" class="small">A simulação é salva na base; resultado e identificador são devolvidos na mesma chamada.</text></g><g data-node="async" class="node"><rect x="40" y="460" width="1720" height="660" fill="#f4f6fa" stroke="#cbd3e3"/><text x="58" y="488" class="section">02 | ANÁLISE DE CRÉDITO ASSÍNCRONA</text><text x="58" y="510" class="small">Aceite inicial com protocolo; processamento e resultado posteriores. Sem API de status e sem mesa.</text></g><g data-edge="simulate"><polyline class="hit" points="410,295 580,295" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="410,295 580,295" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="410,295 580,295" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="495" y="285" text-anchor="middle" transform="rotate(0 495 285)" class="edge-label">Solicitação / resultado</text></g><g data-edge="simulate_rules"><polyline class="hit" points="1030,295 1350,295" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1030,295 1350,295" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1030,295 1350,295" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1190" y="285" text-anchor="middle" transform="rotate(0 1190 285)" class="edge-label">Regras / resultado</text></g><g data-edge="accept"><polyline class="hit" points="410,640 434,640 434,616.6666666666666 580,616.6666666666666" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="410,640 434,640 434,616.6666666666666 580,616.6666666666666" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="410,640 434,640 434,616.6666666666666 580,616.6666666666666" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="507" y="606.6666666666666" text-anchor="middle" transform="rotate(0 507 606.6666666666666)" class="edge-label">Solicitação / aceite</text></g><g data-edge="decide"><polyline class="hit" points="1030,640 1350,640" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="1030,640 1350,640" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="1030,640 1350,640" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1190" y="630" text-anchor="middle" transform="rotate(0 1190 630)" class="edge-label">Decisão automática</text></g><g data-edge="save_simulation"><polyline class="hit" points="805,360 805,384 1054,384 1054,975 1030,975" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="805,360 805,384 1054,384 1054,975 1030,975" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="805,360 805,384 1054,384 1054,975 1030,975" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="929.5" y="374" text-anchor="middle" transform="rotate(0 929.5 374)" class="edge-label">Salva simulação</text></g><g data-edge="persist"><polyline class="hit" points="730,710 730,900" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="730,710 730,900" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="730,710 730,900" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="742" y="805" text-anchor="middle" transform="rotate(-90 742 805)" class="edge-label">Salva vínculo</text></g><g data-edge="load_simulation"><polyline class="hit" points="880,900 880,710" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="880,900 880,710" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="880,900 880,710" fill="none" stroke="#52606d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="892" y="805" text-anchor="middle" transform="rotate(-90 892 805)" class="edge-label">Simulação salva</text></g><g data-edge="notify"><polyline class="hit" points="580,663.3333333333334 556,663.3333333333334 556,876 240,876 240,900" stroke="transparent" stroke-width="16" fill="none"/><polyline class="hit" points="580,663.3333333333334 556,663.3333333333334 556,876 240,876 240,900" fill="none" stroke="white" stroke-width="5" pointer-events="none"/><polyline points="580,663.3333333333334 556,663.3333333333334 556,876 240,876 240,900" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="398" y="866" text-anchor="middle" transform="rotate(0 398 866)" class="edge-label">Resultado correlacionado</text></g><g data-node="heading" class="node"><rect x="40" y="20" width="1720" height="85" fill="transparent"/><text x="40" y="48" class="heading">ENTREGA 1 | 11/01/2027</text><text x="40" y="75" class="small">Simulação síncrona + análise de crédito assíncrona + correlação</text></g><g data-node="partner" class="node"><rect x="70" y="230" width="340" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="259" class="title">Parceiro</text><text x="86" y="282" class="small">Solicita a simulação</text><text x="86" y="302" class="small">Recebe resultado + idSimulacao</text><text x="86" y="322" class="small">Nomes dos campos a contratar</text></g><g data-node="simulation" class="node change-new"><rect x="580" y="230" width="450" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="596" y="259" class="title">API de simulação</text><text x="596" y="282" class="small">Valida a entrada e aplica as regras</text><text x="596" y="302" class="small">Salva dados e resultado da simulação</text><text x="596" y="322" class="small">Retorna resultado + idSimulacao</text></g><g data-node="rules" class="node"><rect x="1350" y="230" width="370" height="130" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1366" y="259" class="title">PDEC | Simulação</text><text x="1366" y="282" class="small">Regras de simulação</text><text x="1366" y="302" class="small">REF até 20/11/2026</text><text x="1366" y="322" class="small">Integração a detalhar no contrato</text></g><g data-node="requester" class="node"><rect x="70" y="570" width="340" height="140" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="599" class="title">Parceiro | Solicitação</text><text x="86" y="622" class="small">Envia idSimulacao já persistido</text><text x="86" y="642" class="small">Solicita a análise de crédito</text><text x="86" y="662" class="small">Recebe protocolo de aceite</text><text x="86" y="682" class="small">Não aguarda a decisão de crédito</text></g><g data-node="analysis" class="node change-new"><rect x="580" y="570" width="450" height="140" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="596" y="599" class="title">API / esteira de análise</text><text x="596" y="622" class="small">Recebe idSimulacao e consulta a base</text><text x="596" y="642" class="small">Vincula análise à simulação persistida</text><text x="596" y="662" class="small">Persiste o aceite e agenda a análise</text><text x="596" y="682" class="small">Processamento assíncrono; sem mesa</text></g><g data-node="pdec" class="node"><rect x="1350" y="570" width="370" height="140" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1366" y="599" class="title">PDEC | Análise automática</text><text x="1366" y="622" class="small">Execução após o aceite</text><text x="1366" y="642" class="small">REF até 20/11/2026</text><text x="1366" y="662" class="small">Casos sem decisão: definir na REF</text><text x="1366" y="682" class="small">Chamada interna conforme contrato</text></g><g data-node="callback" class="node"><rect x="70" y="900" width="340" height="150" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="86" y="929" class="title">Retorno ao parceiro</text><text x="86" y="952" class="small">Resultado posterior e correlacionado</text><text x="86" y="972" class="small">Callback com mTLS é a proposta</text><text x="86" y="992" class="small">Confirmar mecanismo até 20/11</text><text x="86" y="1012" class="small">Prever retentativas e recuperação</text></g><g data-node="db" class="node change-new"><rect x="580" y="900" width="450" height="150" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><path d="M580,910 Q805,930 1030,910" fill="none" stroke="#0033cc"/><text x="596" y="942" class="title">Persistência da esteira | MySQL</text><text x="596" y="967" class="small">Simulação: dados, resultado e identificador</text><text x="596" y="987" class="small">Análise vinculada pelo idSimulacao</text><text x="596" y="1007" class="small">Estados, decisões e tentativas de retorno</text></g><g data-node="excluded" class="node change-legacy"><rect x="1350" y="900" width="370" height="150" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="1366" y="929" class="title">ENTREGAS POSTERIORES</text><text x="1366" y="952" class="small">Entrega 2: API de status</text><text x="1366" y="972" class="small">Mesa mínima, fila e decisão manual</text><text x="1366" y="992" class="small">Entrega 3: pendências e arquivos</text><text x="1366" y="1012" class="small">Datas a definir</text></g><g data-node="milestones" class="node"><rect x="40" y="1170" width="550" height="230" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="56" y="1199" class="title">MARCOS E PREMISSAS</text><text x="56" y="1222" class="small">16/11/2026: início dos trabalhos preliminares</text><text x="56" y="1242" class="small">20/11/2026: contratos e REF definidos</text><text x="56" y="1262" class="small">11/01/2027: Entrega 1</text><text x="56" y="1282" class="small"></text><text x="56" y="1302" class="small">Prazo depende de definições e capacidade.</text><text x="56" y="1322" class="small">Preparação técnica em paralelo aos contratos.</text></g><g data-node="tradeoffs" class="node"><rect x="625" y="1170" width="1135" height="230" rx="2" fill="white" stroke="#0033cc" stroke-width="1.3"/><text x="641" y="1199" class="title">REALOCAR PESSOAS PARA O DESENVOLVIMENTO</text><text x="641" y="1222" class="small">Vitor | Modernização da esteira automática: redução de 2 devs para 1 dev.</text><text x="641" y="1242" class="small">Gustavo | Migração da tela PTA → PCRE-JULG: novo prazo em 15/02/2027.</text><text x="641" y="1262" class="small">                 Renegociar com a Serasa a desativação da API String (pendente).</text><text x="641" y="1282" class="small">Aine | Migração de bureaux desacelera; Neurotech passa integralmente para 2027.</text><text x="641" y="1302" class="small"></text><text x="641" y="1322" class="small">Alocação nominal e dedicação na Entrega 1 ainda precisam ser confirmadas.</text><text x="641" y="1342" class="small">15/02/2027 é o prazo da migração da tela, não da segunda entrega FIDC.</text></g><g data-node="legend" class="node"><rect x="40" y="1450" width="1720" height="65" fill="transparent"/><text x="40" y="1468" class="small">Azul: entrega a implementar. Cinza: escopo posterior. IDs ilustrativos, sujeitos ao contrato.</text><text x="40" y="1489" class="small">Pontilhado: resultado posterior ao aceite; o transporte do callback pode ser uma chamada HTTP síncrona.</text></g></svg>